<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Advertentie Agent{% endblock %} · JUST.LEAD</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--text:#14171c;--muted:#5d6672;--line:#e3e6ea;--accent:#1f5eff;--accent-ink:#fff;--good:#11845b;--bad:#c2372b;--warn:#a86a00;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--surface:#171a20;--text:#e8eaee;--muted:#9aa3ae;--line:#2a2f37;--accent:#6b93ff;--accent-ink:#0f1115;--good:#3ccf91;--bad:#ff7a6e;--warn:#e7b34c;--chip:#222730}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
header{background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
header .wrap{display:flex;align-items:center;gap:16px;height:56px}
.brand{font-weight:700;letter-spacing:.02em;color:var(--text)}
.brand span{color:var(--accent)}
.mode{margin-left:auto;white-space:nowrap;font-size:12px;padding:3px 8px;border-radius:99px;background:var(--chip);color:var(--muted)}
.mode.live{background:var(--bad);color:#fff}
main{padding:24px 0 64px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:17px;margin:32px 0 12px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted)}
.chip.active,.chip.applied,.chip.done{color:var(--good)}
.chip.paused,.chip.proposed,.chip.running{color:var(--warn)}
.chip.error,.chip.failed,.chip.rejected{color:var(--bad)}
.btn{display:inline-block;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
form.inline{display:inline}
.bar{height:6px;background:var(--chip);border-radius:99px;overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--accent)}
pre.report{white-space:pre-wrap;font:inherit;margin:0}
label{display:block;font-weight:600;margin:14px 0 4px}
.hint{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],input[type=url],input[type=number],textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:inherit}
textarea{min-height:90px}
.checks{display:flex;gap:16px;flex-wrap:wrap}.checks label{font-weight:400;display:flex;gap:6px;align-items:center;margin:4px 0}
.cols{display:grid;gap:0 20px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.errors{background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid var(--bad);border-radius:8px;padding:10px 14px;margin-bottom:16px}
details summary{cursor:pointer;color:var(--muted)}
.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}
@media (max-width:600px){h1{font-size:20px}th,td{padding:8px}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="/">JUST<span>.</span>LEAD · Advertentie Agent</a>
  <span class="mode {{ 'live' if settings.live }}">{{ 'LIVE' if settings.live else 'Sandbox' }} · {{ 'AI' if settings.ai_enabled else 'Regels' }}</span>
</div></header>
<main><div class="wrap">{% block content %}{% endblock %}</div></main>
</body>
</html>
