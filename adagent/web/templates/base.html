<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Advertentie Agent{% endblock %} · JUST.LEAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap">
<style>
/* JUST.LEAD. huisstijl: wit eerst, zwart voor tekst en vlakken, oranje spaarzaam. Archivo. Geen schaduwen. */
:root{--bg:#f3f3f3;--surface:#ffffff;--text:#0a0a0b;--muted:#6b6b6b;--body:#3a3a3a;--line:#0a0a0b1a;--line-strong:#0a0a0b38;--field:#0a0a0b66;
--accent:#ff5a1f;--black:#0a0a0b;--ink:#1a1a1b;--gray-200:#e9e9e9;--gray-400:#8c8c8c;--good:#0f7a4f;--bad:#b8360a;--warn:#8a5a00;--chip:#f3f3f3;
--on-black-line:#ffffff29;--on-black-70:#ffffffb3;--on-black-55:#ffffff8c;
--font:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;--ease:cubic-bezier(.7,0,.2,1);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--text);text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}a:hover{text-decoration-color:var(--text)}
header{background:var(--black);color:#fff;position:sticky;top:0;z-index:20}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .wrap{display:flex;align-items:center;gap:16px;height:60px}
.brand{font-weight:900;font-style:italic;font-variation-settings:"wdth" 80;font-size:20px;color:#fff;text-decoration:none}
.brand-sub{color:var(--on-black-70);font-size:14px}
.mode{margin-left:auto;white-space:nowrap;font-size:12px;font-weight:500;padding:4px 10px;border-radius:99px;border:1px solid var(--on-black-line);color:var(--on-black-70)}
.mode.live{background:var(--accent);border-color:var(--accent);color:var(--black)}
main{padding:32px 0 80px}
h1,h2,.h{font-variation-settings:"wdth" 90;font-weight:600;letter-spacing:-.03em;line-height:1.02;text-wrap:balance}
h1{font-size:clamp(30px,4vw,52px);margin:0 0 6px}h2{font-size:22px;margin:36px 0 12px}
.sub{color:var(--body);margin:0 0 24px}
.card{background:var(--surface);border-radius:20px;padding:20px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat .k{font-size:13px;font-weight:500;color:var(--muted)}
.stat .v{font-size:30px;font-weight:600;font-variation-settings:"wdth" 90;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;background:var(--surface);border-radius:20px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:500}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.chip{display:inline-block;font-size:12px;font-weight:500;padding:2px 10px;border-radius:99px;border:1px solid var(--line-strong);color:var(--body);background:var(--surface)}
.chip.active,.chip.applied,.chip.done{background:var(--accent);border-color:var(--accent);color:var(--black)}
.chip.paused,.chip.proposed,.chip.running{background:var(--gray-200);border-color:var(--gray-200);color:var(--body)}
.chip.error,.chip.failed,.chip.rejected{border-color:var(--bad);color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--black);background:var(--surface);color:var(--black);padding:10px 18px;border-radius:99px;font-weight:600;cursor:pointer;text-decoration:none;position:relative;overflow:hidden;isolation:isolate}
.btn.primary{background:var(--black);color:#fff}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--black)}
.btn.accent::before{content:"";position:absolute;inset:0;background:#fff;transform:translateY(101%);transition:transform .6s var(--ease);z-index:-1}
.btn.accent:hover:not(:disabled)::before{transform:none}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
form.inline{display:inline}
.bar{height:6px;background:var(--gray-200);border-radius:99px;overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--black)}
pre.report{white-space:pre-wrap;font:inherit;margin:0;color:var(--body)}
.errors{background:#fff1ea;border-radius:14px;padding:12px 16px;margin-bottom:16px;color:var(--bad)}
details summary{cursor:pointer;color:var(--muted)}
.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}
:focus-visible{outline:2px solid var(--black);outline-offset:3px}
@media (max-width:600px){th,td{padding:8px}.brand-sub{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
{% block head %}{% endblock %}
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="/">JUST.LEAD.</a><span class="brand-sub">Advertentie Agent</span>
  <span class="mode {{ 'live' if settings.live }}">{{ 'LIVE' if settings.live else 'Sandbox' }} · {{ 'AI' if settings.ai_enabled else 'Regels' }}</span>
</div></header>
<main><div class="wrap">{% block content %}{% endblock %}</div></main>
</body>
</html>
